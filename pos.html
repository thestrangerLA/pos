<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS ຮ້ານຄ້າ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf8f5;
  --surface:#ffffff;
  --text:#1c1917;
  --muted:#6b7280;
  --line:#ebd9c8;
  --brand:#dc2626;
  --on-brand:#ffffff;
  --brand-soft:#fee2e2;
  --yellow:#eab308;
  --yellow-soft:#fef9c3;
  --on-yellow:#854d0e;
  --good:#16a34a;
  --bad:#dc2626;
  --warn:#ca8a04;
  --warn-soft:#fef08a;
  --bad-soft:#fee2e2;
  --shadow:0 -6px 24px rgba(220,38,38,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171212;
    --surface:#221a1a;
    --text:#fef2f2;
    --muted:#a39595;
    --line:#3d2c2c;
    --brand:#ef4444;
    --on-brand:#ffffff;
    --brand-soft:#3d1a1a;
    --yellow:#facc15;
    --yellow-soft:#423408;
    --on-yellow:#fef08a;
    --good:#4ade80;
    --bad:#f87171;
    --warn:#facc15;
    --warn-soft:#423408;
    --bad-soft:#451a1a;
    --shadow:0 -6px 24px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#171212;
  --surface:#221a1a;
  --text:#fef2f2;
  --muted:#a39595;
  --line:#3d2c2c;
  --brand:#ef4444;
  --on-brand:#ffffff;
  --brand-soft:#3d1a1a;
  --yellow:#facc15;
  --yellow-soft:#423408;
  --on-yellow:#fef08a;
  --good:#4ade80;
  --bad:#f87171;
  --warn:#facc15;
  --warn-soft:#423408;
  --bad-soft:#451a1a;
  --shadow:0 -6px 24px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Lao','Noto Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;padding-bottom:150px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header{padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:20px;font-weight:700;color:var(--brand)}
header .r{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.icon{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{max-width:720px;margin:0 auto;padding:8px 16px}
h2{font-size:18px;margin:0 0 12px;font-weight:700}
h3{font-size:15px;margin:20px 0 8px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.good{color:var(--good)}.bad{color:var(--bad)}
.btn{border:0;background:var(--brand);color:var(--on-brand);padding:11px 16px;border-radius:10px;font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.accent{background:var(--yellow);color:#1c1917}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,.tile:focus-visible,.chip:focus-visible,.item:focus-visible,.icon:focus-visible,.seg button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:44px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label input,label select,label textarea{margin-top:4px;color:var(--text);font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;margin:4px 0 6px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);font-weight:700;color:var(--brand)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:12px;border:1px solid var(--line);margin:8px 0 4px}
.strip div{padding:12px;border-left:1px solid var(--line);min-width:0}
.strip div:first-child{border-left:0}
.strip b{display:block;font-size:16px;margin-top:2px;overflow-wrap:anywhere}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item .t{font-weight:500}
.item .lead{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:700;flex:none;font-size:18px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--yellow-soft);color:var(--on-yellow);font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile:active{transform:scale(.98)}
.tile[disabled]{opacity:.45;cursor:not-allowed}
.tile .im{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--brand)}
.tile .nm{line-height:1.3;padding:0 2px;font-weight:500}
.tile .p{font-size:17px;font-weight:700;color:var(--brand);padding:0 2px}
.tile .q{position:absolute;top:12px;right:12px;background:var(--yellow);color:#1c1917;border-radius:999px;font-size:12px;min-width:24px;text-align:center;padding:1px 6px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;min-width:0;border:0;background:none;padding:8px 1px 7px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--brand);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#bar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;z-index:15;display:none}
#bar.show{display:block}
#bar button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:12px 18px;font-weight:700;font-size:16px;box-shadow:var(--shadow);cursor:pointer}
#bar .bar-badge{background:var(--yellow);color:#1c1917;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}
#sheet{position:fixed;inset:0;background:rgba(20,10,10,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheetBody{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#1c1917;color:#ffffff;padding:9px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.15)}
#toast.show{opacity:1}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer}
.big{font-size:38px;font-weight:700;line-height:1.1;margin:2px 0}
.pnl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.hero{padding:18px 4px 6px}
.note{font-size:13px;color:var(--muted);margin:8px 2px}
.pay{display:flex;gap:8px;margin-bottom:12px}
.pay .chip{flex:1;text-align:center}
.qrbox{background:#fff;border-radius:12px;padding:10px;text-align:center;margin-bottom:12px;border:1px solid var(--line)}
.qrbox img{max-width:210px;width:100%;display:block;margin:0 auto}
.qrbox div{color:#111;font-weight:600;margin-top:6px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px}
.bars .b{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}
.barl{display:flex;gap:3px;margin-top:4px;font-size:11px;color:var(--muted)}
.barl span{flex:1;text-align:center;overflow:hidden}
.meter{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;margin:6px 0 10px}
.meter i{display:block;height:100%}
.paper{background:#fff;color:#111;border-radius:10px;padding:16px;font-size:14px;border:1px solid var(--line)}
.pimg{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pimg .pv{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;flex:none;overflow:hidden}
.pimg .pv img{width:100%;height:100%;object-fit:cover}
#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  body{background:#fff;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;display:block;break-after:page;page-break-after:always}
  #printArea img:last-child{break-after:auto;page-break-after:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="shopname">POS ຮ້ານຄ້າ</h1>
  <div class="r"><span id="today"></span><button class="icon" aria-label="ຕັ້ງຄ່າຮ້ານ" onclick="settingsSheet()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</header>
<main id="view"></main>
<div id="bar"></div>
<nav><div>
  <button data-t="sell" onclick="setTab('sell')"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.4a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L19 8H6"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>ຂາຍ</button>
  <button data-t="prod" onclick="setTab('prod')"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>ສິນຄ້າ</button>
  <button data-t="stock" onclick="setTab('stock')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ສະຕັອກ</button>
  <button data-t="cash" onclick="setTab('cash')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>ຮັບ-ຈ່າຍ</button>
  <button data-t="inv" onclick="setTab('inv')"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>Invoice</button>
  <button data-t="rep" onclick="setTab('rep')"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>ລາຍງານ</button>
</div></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
const KEY='pos_shop_lao_v1';
var S;
let tab='sell', period='today', cart=[], q='', catF='ທັງໝົດ', stockSeg='stock', repSeg='sales';
let pay={method:'ເງິນສົດ',disc:'',recv:'',cashPart:'',cust:''};
let tmpImg='', tmpQr='';

const SHOP0={name:'POS ຮ້ານຄ້າ',addr:'',phone:'',taxId:'',vat:0,cur:'₭',note:'ຂອບໃຈທີ່ໃຊ້ນິການ',qr:''};
function seed(){
  const P=[
    ['ນ້ຳດື່ມ 600 ມລ.','8851234500011','ເຄື່ອງດື່ມ',5000,8000,48,12],
    ['ໂຄ້ກ 325 ມລ.','8851234500028','ເຄື່ອງດື່ມ',10000,15000,24,12],
    ['ກາເຟກະປ໋ອງ','8851234500066','ເຄື່ອງດື່ມ',12000,18000,20,6],
    ['ມາມ່າ ຕົ້ມຍຳກຸ້ງ','8851234500035','ອາຫານແຫ້ງ',6000,8000,60,20],
    ['ໄຂ່ໄກ່ ເບີ 2 (ແຜງ)','8851234500042','ຂອງສົດ',95000,115000,10,3],
    ['ເຂົ້າຈີ່ແຊນວິດ','8851234500059','ເບເກີຣີ່',20000,30000,8,4]
  ];
  return {seq:100,shop:{...SHOP0},products:P.map((p,i)=>({id:i+1,name:p[0],sku:p[1],cat:p[2],cost:p[3],price:p[4],stock:p[5],min:p[6],img:''})),sales:[],entries:[],moves:[],purchases:[],invoices:[],invSeq:1};
}
function blank(){return {seq:100,shop:{...SHOP0},products:[],sales:[],entries:[],moves:[],purchases:[],invoices:[],invSeq:1}}
function load(){
  let d=null;
  try{
    const r=localStorage.getItem(KEY)||localStorage.getItem('pos_shop_v1');
    if(r)d=JSON.parse(r);
  }catch(e){}
  if(!d)return seed();
  d.shop={...SHOP0,...(d.shop||{})};
  if(d.shop.cur==='฿') d.shop.cur='₭';
  if(d.shop.name==='POS ร้านค้า') d.shop.name='POS ຮ້ານຄ້າ';
  d.purchases=d.purchases||[];d.invoices=d.invoices||[];d.invSeq=d.invSeq||1;
  d.products.forEach(p=>{if(p.img===undefined)p.img=''});
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('ພື້ນທີ່ຈັດເກັບຂໍ້ມູນເຕັມ ລອງຫຼຸດຈຳນວນຮູບພາບ')}}
const uid=()=>S.seq++;
const num=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const r2=n=>Math.round(n*100)/100;
const cur=()=>(S&&S.shop&&S.shop.cur)||'₭';
const fmt=n=>cur()+' '+Number(n||0).toLocaleString('lo-LA',{minimumFractionDigits:0,maximumFractionDigits:2});
const fdt=ts=>new Date(ts).toLocaleString('lo-LA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const fdate=ts=>new Date(ts).toLocaleDateString('lo-LA',{day:'numeric',month:'short',year:'numeric'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const prod=id=>S.products.find(p=>p.id===id);
function inPeriod(ts){
  if(period==='all')return true;
  const d=new Date(ts),n=new Date();
  if(period==='today')return d.toDateString()===n.toDateString();
  if(period==='week'){const st=new Date();st.setHours(0,0,0,0);return ts>=st.getTime()-6*864e5}
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2000)}
function openSheet(h){$('sheetBody').innerHTML=h;$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open')}
function confirmAct(msg,code){openSheet(`<h2>ຢືນຢັນ</h2><p>${msg}</p><div class="g2"><button class="btn ghost" onclick="closeSheet()">ຍົກເລີກ</button><button class="btn danger" onclick="${code}">ຢືນຢັນ</button></div>`)}
function readImg(file,max,cb,qual){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',qual||0.7))};
    im.onerror=()=>toast('ບໍ່ສາມາດເປີດໄຟລ໌ຮູບໄດ້');im.src=fr.result};
  fr.readAsDataURL(file);
}
const thumb=(p,cls)=>p.img?`<img class="${cls||'thumb'}" src="${p.img}" alt="">`:`<div class="${cls||'thumb'}">${esc((p.name||'?').trim().charAt(0))}</div>`;

function setTab(t){tab=t;render();window.scrollTo(0,0)}
function setPeriod(p){period=p;render()}
function periodChips(){
  return `<div class="chips">${[['today','ມື້ນີ້'],['week','7 ມື້'],['month','ເດືອນນີ້'],['all','ທັງໝົດ']].map(([k,l])=>`<button class="chip ${period===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`).join('')}</div>`;
}
function seg(items,val,fn){return `<div class="seg">${items.map(([k,l])=>`<button class="${val===k?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('shopname').textContent=S.shop.name||'POS ຮ້ານຄ້າ';
  $('view').innerHTML=({sell:viewSell,prod:viewProd,stock:viewStock,cash:viewCash,inv:viewInv,rep:viewRep})[tab]();
  renderBar();
}

/* ---------- ຂາຍໜ້າຮ້ານ ---------- */
function cartCount(){return cart.reduce((a,c)=>a+c.qty,0)}
function cartSub(){return cart.reduce((a,c)=>{const p=prod(c.pid);return a+(p?p.price*c.qty:0)},0)}
function renderBar(){
  const b=$('bar');
  if(tab==='sell'&&cart.length){b.classList.add('show');b.innerHTML=`<button onclick="openCart()"><span><span class="bar-badge">${cartCount()} ອັນ</span> &nbsp;ກະຕ່າສິນຄ້າ</span><span class="num">${fmt(cartSub())} · ຊຳລະເງິນ &rsaquo;</span></button>`}
  else{b.classList.remove('show');b.innerHTML=''}
}
function viewSell(){
  const ts=S.sales.filter(s=>new Date(s.ts).toDateString()===new Date().toDateString());
  const sum=ts.reduce((a,s)=>a+s.total,0);
  const cats=['ທັງໝົດ',...new Set(S.products.map(p=>p.cat).filter(Boolean))];
  return `<p class="muted small" style="margin:4px 0 10px">ຍອດຂາຍມື້ນີ້ <b class="num" style="color:var(--brand)">${fmt(sum)}</b> · ${ts.length} ບິນ</p>
  <input id="q" value="${esc(q)}" placeholder="ສະແກນບາໂຄດ ຫຼື ພິມຊື່ສິນຄ້າ" autocomplete="off" oninput="q=this.value;$('grid').innerHTML=gridHtml()" onkeydown="if(event.key==='Enter')scanEnter()">
  <div class="chips">${cats.map(c=>`<button class="chip ${catF===c?'on':''}" onclick="catF=this.dataset.c;render()" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div id="grid" class="grid">${gridHtml()}</div>`;
}
function gridHtml(){
  const k=q.trim().toLowerCase();
  const L=S.products.filter(p=>(catF==='ທັງໝົດ'||p.cat===catF)&&(!k||p.name.toLowerCase().includes(k)||String(p.sku).includes(k)));
  if(!L.length)return `<div class="empty" style="grid-column:1/-1">${S.products.length?'ບໍ່ພົບສິນຄ້າທີ່ຄົ້ນຫາ':'ຍັງບໍ່ມີສິນຄ້າ ໄປທີ່ແທັບ “ສິນຄ້າ” ເພື່ອເພີ່ມສິນຄ້າກ່ອນ'}</div>`;
  return L.map(p=>{
    const inCart=(cart.find(c=>c.pid===p.id)||{}).qty||0;
    return `<button class="tile" ${p.stock<=0?'disabled':''} onclick="addCart(${p.id})">${inCart?`<span class="q">${inCart}</span>`:''}${thumb(p,'im')}<span class="nm">${esc(p.name)}</span><span class="p num">${fmt(p.price)}</span><span class="small ${p.stock<=p.min?'bad':'muted'}" style="padding:0 2px">${p.stock<=0?'ສິນຄ້າໝົດ':'ຍັງເຫຼືອ '+p.stock}</span></button>`;
  }).join('');
}
function scanEnter(){
  const k=q.trim();if(!k)return;
  const p=S.products.find(x=>String(x.sku)===k);
  if(p){addCart(p.id);q='';$('q').value='';$('grid').innerHTML=gridHtml()}
  else toast('ບໍ່ພົບບາໂຄດນີ້');
}
function addCart(pid){
  const p=prod(pid);if(!p)return;
  const c=cart.find(x=>x.pid===pid);
  if((c?c.qty:0)+1>p.stock){toast('ສະຕັອກບໍ່ພໍ ຍັງເຫຼືອ '+p.stock);return}
  if(c)c.qty++;else cart.push({pid,qty:1});
  const g=$('grid');if(g)g.innerHTML=gridHtml();
  renderBar();
}
function chgQty(pid,d){
  const c=cart.find(x=>x.pid===pid),p=prod(pid);if(!c)return;
  if(d>0&&c.qty+1>p.stock){toast('ສະຕັອກບໍ່ພໍ ຍັງເຫຼືອ '+p.stock);return}
  c.qty+=d;
  if(c.qty<=0)cart=cart.filter(x=>x.pid!==pid);
  if(!cart.length){closeSheet();render();return}
  cartSheet();renderBar();
}
function openCart(){pay={method:'ເງິນສົດ',disc:'',recv:'',cashPart:'',cust:''};cartSheet()}
function qrBlock(){
  return S.shop.qr
    ?`<div class="qrbox"><img src="${S.shop.qr}" alt="QR ຮັບເງິນ"><div class="num" id="t_qrAmt"></div></div>`
    :`<p class="note">ຍັງບໍ່ໄດ້ໃສ່ຮູບ QR ຂອງຮ້ານ ໄປທີ່ໄອຄອນຕັ້ງຄ່າດ້ານເທິງເພື່ອອັບໂຫຼດ</p>`;
}
function cartSheet(){
  const m=pay.method;
  openSheet(`<h2>ກະຕ່າສິນຄ້າ</h2>
  <div class="list" style="padding:0 14px">${cart.map(c=>{const p=prod(c.pid);return `<div class="line" style="align-items:center"><div class="lead" style="display:flex;gap:10px;align-items:center;min-width:0">${thumb(p)}<div><div class="t">${esc(p.name)}</div><div class="muted small num">${fmt(p.price)} × ${c.qty} = ${fmt(p.price*c.qty)}</div></div></div><div class="qty"><button aria-label="ຫຼຸດ" onclick="chgQty(${p.id},-1)">−</button><b class="num">${c.qty}</b><button aria-label="ເພີ່ມ" onclick="chgQty(${p.id},1)">+</button></div></div>`}).join('')}</div>
  <div style="height:14px"></div>
  <div class="g2"><label>ສ່ວນຫຼຸດ<input id="disc" type="number" inputmode="decimal" min="0" value="${esc(pay.disc)}" oninput="pay.disc=this.value;payTotals()"></label><label>ຊື່ລູກຄ້າ (ບໍ່ບັງຄັບ)<input id="cust" value="${esc(pay.cust)}" oninput="pay.cust=this.value"></label></div>
  <div class="pay">${['ເງິນສົດ','QR','ແບ່ງຈ່າຍ'].map(x=>`<button class="chip ${m===x?'on':''}" onclick="pay.method=this.dataset.m;cartSheet()" data-m="${x}">${x==='ແບ່ງຈ່າຍ'?'ແບ່ງຈ່າຍ (ສົດ+QR)':x}</button>`).join('')}</div>
  ${m==='ເງິນສົດ'?`<label>ຮັບເງິນມາ<input id="recv" type="number" inputmode="decimal" min="0" value="${esc(pay.recv)}" oninput="pay.recv=this.value;payTotals()"></label>`:''}
  ${m==='QR'?qrBlock():''}
  ${m==='ແບ່ງຈ່າຍ'?`<label>ສ່ວນທີ່ຈ່າຍເປັນເງິນສົດ<input id="cpart" type="number" inputmode="decimal" min="0" value="${esc(pay.cashPart)}" oninput="pay.cashPart=this.value;payTotals()"></label>${qrBlock()}`:''}
  <div class="line"><span class="muted">ລວມ</span><span class="num" id="t_sub"></span></div>
  <div class="line"><span class="muted">ສ່ວນຫຼຸດ</span><span class="num" id="t_disc"></span></div>
  <div class="line"><b>ຍອດສຸດທິ</b><b class="num" style="font-size:20px;color:var(--brand)" id="t_total"></b></div>
  ${m==='ເງິນສົດ'?`<div class="line"><span class="muted">ເງິນທອນ</span><b class="num" id="t_change"></b></div>`:''}
  ${m==='ແບ່ງຈ່າຍ'?`<div class="line"><span class="muted">ສ່ວນທີ່ເຫຼືອຈ່າຍ QR</span><b class="num" id="t_rest"></b></div>`:''}
  <div style="height:12px"></div>
  <div class="g2"><button class="btn ghost" onclick="closeSheet()">ກັບໄປເລືອກຕໍ່</button><button class="btn" onclick="checkout()">ຮັບຊຳລະເງິນ</button></div>`);
  payTotals();
}
function totals(){
  const sub=cartSub(),d=Math.min(Math.max(num(pay.disc),0),sub),total=sub-d;
  return {sub,d,total};
}
function payTotals(){
  const t=totals();
  $('t_sub').textContent=fmt(t.sub);$('t_disc').textContent='−'+fmt(t.d);$('t_total').textContent=fmt(t.total);
  const ch=$('t_change');
  if(ch){const rv=pay.recv===''?null:num(pay.recv);ch.textContent=rv===null?'—':(rv<t.total?'ຮັບເງິນບໍ່ພໍ':fmt(rv-t.total));ch.className='num '+(rv!==null&&rv<t.total?'bad':'good')}
  const qa=$('t_qrAmt');
  if(qa){const cp=pay.method==='ແບ່ງຈ່າຍ'?Math.min(Math.max(num(pay.cashPart),0),t.total):0;qa.textContent='ສະແກນຈ່າຍ '+fmt(t.total-cp)}
  const rs=$('t_rest');
  if(rs){const cp=Math.min(Math.max(num(pay.cashPart),0),t.total);rs.textContent=fmt(t.total-cp)}
}
function checkout(){
  const t=totals();
  let cash=0,qr=0;
  if(pay.method==='ເງິນສົດ'){
    if(pay.recv!==''&&num(pay.recv)<t.total){toast('ຮັບເງິນບໍ່ພໍ');return}
    cash=t.total;
  }else if(pay.method==='QR'){qr=t.total}
  else{
    cash=Math.min(Math.max(num(pay.cashPart),0),t.total);qr=r2(t.total-cash);
    if(cash<=0||qr<=0){toast('ແບ່ງຈ່າຍ: ຍອດເງິນສົດຕ້ອງຫຼາຍກວ່າ 0 ແລະ ໜ້ອຍກວ່າທັງໝົດ');return}
  }
  const now=Date.now(),id=uid();
  const items=cart.map(c=>{const p=prod(c.pid);return {pid:p.id,name:p.name,qty:c.qty,price:p.price,cost:p.cost}});
  const cogs=r2(items.reduce((a,i)=>a+i.cost*i.qty,0));
  const label=pay.method==='ແບ່ງຈ່າຍ'?'ແບ່ງຈ່າຍ (ເງິນສົດ+QR)':pay.method;
  const sale={id,no:'POS-'+String(id).padStart(5,'0'),ts:now,items,discount:t.d,total:t.total,cogs,method:label,pay:{cash,qr},received:pay.method==='ເງິນສົດ'&&pay.recv!==''?num(pay.recv):cash,cust:pay.cust.trim(),vat:num(S.shop.vat)};
  items.forEach(i=>{const p=prod(i.pid);p.stock-=i.qty;S.moves.push({id:uid(),ts:now,pid:p.id,name:p.name,qty:-i.qty,kind:'ຂາຍ '+sale.no})});
  S.sales.push(sale);
  S.entries.push({id:uid(),ts:now,type:'income',cat:'ຂາຍສິນຄ້າ',amount:t.total,note:sale.no+' · '+label,auto:'sale'});
  cart=[];save();
  render();saleSheet(id,true);
}

/* ---------- Invoice / ໃບເກັບເງິນ ---------- */
function payOf(s){
  if(s.pay)return {cash:s.pay.cash||0,qr:s.pay.qr||0,other:0};
  return {cash:s.method==='ເງິນສົດ'?s.total:0,qr:/QR/.test(s.method)?s.total:0,other:/ບັດ/.test(s.method)?s.total:0};
}
function saleSheet(id,done){
  const s=S.sales.find(x=>x.id===id);if(!s)return;
  openSheet(`<h2>${done?'ຮັບຊຳລະຮຽບຮ້ອຍ':'ບິນ '+esc(s.no)}</h2><p class="muted small" style="margin-top:-6px">${esc(s.no)} · ${fdt(s.ts)} · ${esc(s.method)}${s.cust?' · '+esc(s.cust):''}</p>
  <div class="list" style="padding:0 14px">${s.items.map(i=>`<div class="line"><span>${esc(i.name)} × ${i.qty}</span><span class="num">${fmt(i.price*i.qty)}</span></div>`).join('')}</div>
  ${s.discount>0?`<div class="line"><span class="muted">ສ່ວນຫຼຸດ</span><span class="num">−${fmt(s.discount)}</span></div>`:''}
  <div class="line"><b>ຍອດສຸດທິ</b><b class="num" style="font-size:20px;color:var(--brand)">${fmt(s.total)}</b></div>
  ${s.method==='ເງິນສົດ'&&s.received>s.total?`<div class="line"><span class="muted">ຮັບເງິນ / ທອນ</span><span class="num">${fmt(s.received)} / ${fmt(s.received-s.total)}</span></div>`:''}
  <div style="height:12px"></div>
  <div class="g2"><button class="btn ghost" onclick="invFromSale(${id})">ສ້າງ Invoice ຈາກບິນນີ້</button><button class="btn" onclick="closeSheet()">${done?'ຂາຍລາຍການຕໍ່ໄປ':'ປິດ'}</button></div>
  ${done?'':`<button class="btn danger full" style="margin-top:10px" onclick="confirmAct('ຍົກເລີກບິນ ${s.no}? ສະຕັອກຈະຖືກຄືນ ແລະ ລາຍການເງິນເຂົ້າຈະຖືກລຶບ','voidSale(${id})')">ຍົກເລີກບິນນີ້</button>`}`);
}
function invFromSale(id){
  const s=S.sales.find(x=>x.id===id);if(!s)return;
  tab='inv';render();
  invSheet(null,{custName:s.cust||'',items:s.items.map(i=>({name:i.name,qty:i.qty,price:i.price})),discount:s.discount||0,vat:0});
}

let invFilter='all',fItems=[],lastInv=null;
const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fromYmd=v=>v?new Date(v+'T12:00:00').getTime():Date.now();
const fdEn=ts=>new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
function calcInv(items,disc,vr){
  const sub=items.reduce((a,i)=>a+num(i.qty)*num(i.price),0),d=Math.min(Math.max(num(disc),0),sub),base=sub-d,vat=vr>0?r2(base*vr/100):0;
  return {sub:r2(sub),d,base,vat,total:r2(base+vat)};
}
const invTotal=v=>calcInv(v.items,v.discount,v.vat).total;
const isOverdue=v=>v.status!=='paid'&&v.due&&new Date(v.due).toDateString()!==new Date().toDateString()&&v.due<Date.now();
function invBadge(v){return v.status==='paid'?'<span class="badge">ຈ່າຍແລ້ວ</span>':isOverdue(v)?'<span class="badge bad">ກາຍກຳນົດ</span>':'<span class="badge warn">ຄ້າງຈ່າຍ</span>'}
function setInvF(k){invFilter=k;render()}
function viewInv(){
  const A=S.invoices;
  const unpaid=A.filter(v=>v.status!=='paid').reduce((a,v)=>a+invTotal(v),0);
  const paid=A.filter(v=>v.status==='paid').reduce((a,v)=>a+invTotal(v),0);
  const L=A.filter(v=>invFilter==='all'||(invFilter==='paid'?v.status==='paid':v.status!=='paid')).sort((a,b)=>b.ts-a.ts||b.id-a.id);
  return `<div class="row between" style="margin:6px 0 4px"><h2 style="margin:0">Invoice (ໃບເກັບເງິນ)</h2><button class="btn sm" onclick="invSheet()">+ ສ້າງ Invoice</button></div>
  <div class="strip"><div><span class="muted small">ຄ້າງຈ່າຍ</span><b class="num ${unpaid>0?'bad':''}">${fmt(unpaid)}</b></div><div><span class="muted small">ຮັບເງິນແລ້ວ</span><b class="num good">${fmt(paid)}</b></div><div><span class="muted small">ທັງໝົດ</span><b class="num">${A.length} ໃບ</b></div></div>
  <div class="chips">${[['all','ທັງໝົດ'],['unpaid','ຄ້າງຈ່າຍ'],['paid','ຈ່າຍແລ້ວ']].map(([k,l])=>`<button class="chip ${invFilter===k?'on':''}" onclick="setInvF('${k}')">${l}</button>`).join('')}</div>
  ${L.length?`<div class="list">${L.map(v=>`<div class="item" tabindex="0" onclick="invView(${v.id})"><div style="min-width:0"><div class="t">${esc(v.no)} · ${esc(v.custName)}</div><div class="muted small">ອອກ ${fdate(v.ts)}${v.due?' · ຄົບ '+fdate(v.due):''}</div></div><div style="text-align:right;flex:none"><b class="num">${fmt(invTotal(v))}</b><br>${invBadge(v)}</div></div>`).join('')}</div>`:`<div class="empty">${A.length?'ບໍ່ມີ Invoice ໃນໝວດນີ້':'ຍັງບໍ່ມີ Invoice ກົດ “ສ້າງ Invoice” ເພື່ອເລີ່ມຕົ້ນ'}</div>`}
  <p class="note">Invoice ແຍກຈາກການຂາຍໜ້າຮ້ານ ບໍ່ຕັດສະຕັອກອັດຕະໂນມັດ ເມື່ອໝາຍວ່າຈ່າຍແລ້ວ ຍອດຈະເຂົ້າໄປທີ່ລາຍຮັບ ແລະ ລາຍງານກຳໄລ-ຂາດທຶນ</p>`;
}
function invSheet(id,pre){
  const v=id?S.invoices.find(x=>x.id===id):null,b=v||pre||{};
  fItems=(b.items&&b.items.length?b.items:[{name:'',qty:1,price:''}]).map(i=>({name:i.name,qty:i.qty,price:i.price}));
  const vat=b.vat!==undefined?b.vat:num(S.shop.vat);
  openSheet(`<h2>${v?'ແກ້ໄຂ '+esc(v.no):'ສ້າງ Invoice'}</h2>
  <label>ຊື່ລູກຄ້າ / ບໍລິສັດ<input id="i_name" value="${esc(b.custName||'')}"></label>
  <label>ທີ່ຢູ່<input id="i_addr" value="${esc(b.custAddr||'')}"></label>
  <label>ເບີໂທ<input id="i_phone" value="${esc(b.custPhone||'')}"></label>
  <div class="g2"><label>ວັນທີອອກ<input id="i_date" type="date" value="${ymd(v?v.ts:Date.now())}"></label><label>ຄົບກຳນົດຊຳລະ<input id="i_due" type="date" value="${ymd(v?(v.due||v.ts):Date.now()+7*864e5)}"></label></div>
  <h3 style="margin-top:6px">ລາຍການ</h3>
  <datalist id="plist">${S.products.map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist>
  <div class="muted small" style="display:grid;grid-template-columns:1fr 62px 90px 34px;gap:6px;margin-bottom:4px"><span>ລາຍການ</span><span>ຈຳນວນ</span><span>ລາຄາ/ໜ່ວຍ</span><span></span></div>
  <div id="irows"></div>
  <button class="btn sm ghost" onclick="addIRow()">+ ເພີ່ມລາຍການ</button>
  <div class="g2" style="margin-top:14px"><label>ສ່ວນຫຼຸດ<input id="i_disc" type="number" inputmode="decimal" value="${b.discount||''}" oninput="invTot()"></label><label>VAT % (ບວກເພີ່ມຈາກຍອດ)<input id="i_vat" type="number" inputmode="decimal" value="${vat}" oninput="invTot()"></label></div>
  <label>ໝາຍເຫດ / ເງື່ອນໄຂການຊຳລະ<textarea id="i_note" rows="3">${esc(b.note||'')}</textarea></label>
  <div class="pnl" style="margin-bottom:12px" id="i_tot"></div>
  <div class="g2"><button class="btn ghost" onclick="${v?`invView(${id})`:'closeSheet()'}">ຍົກເລີກ</button><button class="btn" onclick="saveInv(${id||0})">ບັນທຶກ Invoice</button></div>`);

function markPaid(id,m){

  S.entries=S.entries.filter(e=>!(e.auto==='inv'&&e.ref===id));
  S.entries.push({id:uid(),ts:v.paidTs,type:'income',cat:'ຮັບຊຳລະ Invoice',amount:invTotal(v),note:v.no+' · '+v.custName+' · '+m,auto:'inv',ref:id});

function unmarkPaid(id){
  const v=S.invoices.find(x=>x.id===id);if(!v)return;

  S.entries=S.entries.filter(e=>!(e.auto==='inv'&&e.ref===id));

function delInv(id){
  S.invoices=S.invoices.filter(x=>x.id!==id);

async function invPages(d){

  const T=(t,px,py,o={})=>{x.font=`${o.w||400} ${o.sz||12}px ${FF}`;x.fillStyle=o.col||INK;x.textAlign=o.al||'left';x.textBaseline=o.bl||'middle';x.fillText(o.max?fit(t,o.max):String(t),px,py)};
  const hl=(py,col,lw)=>{x.strokeStyle=col;x.lineWidth=lw||0.7;x.beginPath();x.moveTo(M,py);x.lineTo(W-M,py);x.stroke()};
  const COL={q:287,r:439,a:W-M-3};
  const head=()=>{
    hl(y,TC,0.9);
    T('ລາຍການ',M+3,y+14,{w:700,sz:12,col:TC});T('ຈຳນວນ',COL.q,y+14,{w:700,sz:12,col:TC,al:'center'});
    T('ລາຄາ',COL.r,y+14,{w:700,sz:12,col:TC,al:'right'});T('ລວມ',COL.a,y+14,{w:700,sz:12,col:TC,al:'right'});
    y+=27;hl(y,LINE);
  };
  const np=(first,noHead)=>{
    c=document.createElement('canvas');c.width=W*K;c.height=H*K;x=c.getContext('2d');x.scale(K,K);
    x.fillStyle=BG;x.fillRect(0,0,W,H);pages.push({c,x});
    if(first){
      T('INVOICE',30,85,{w:700,sz:46,col:TC,bl:'alphabetic'});
      T(d.no,W-M-3,75,{w:700,sz:19,col:TC,al:'right',bl:'alphabetic'});
      T(fdEn(d.ts),W-M-3,93,{sz:11,col:GREY,al:'right'});
      if(d.due)T('Due '+fdEn(d.due),W-M-3,109,{sz:11,col:GREY,al:'right'});
      T('FROM',M+3,162,{w:700,sz:11,col:TC});T('BILL TO',335,162,{w:700,sz:11,col:TC});
      T(sh.name||'Shop',M+3,189,{w:700,sz:17,max:270});
      [sh.addr,sh.phone?'Tel '+sh.phone:'',sh.taxId?'Tax ID '+sh.taxId:''].filter(Boolean).slice(0,3).forEach((l,i)=>T(l,M+3,213+i*17,{sz:12.5,col:GREY,max:270}));
      T(d.name,335,189,{w:700,sz:17,max:230});
      d.lines.slice(0,3).forEach((l,i)=>T(l,335,213+i*17,{sz:12.5,col:GREY,max:230}));
      y=310;
    }else{
      T('INVOICE',30,40,{w:700,sz:18,col:TC});T(d.no+' (continued)',W-M-3,40,{sz:11,col:GREY,al:'right'});
      y=62;
    }
    if(!noHead)head();
  };
  const row=r=>{
    if(y+27>H-34)np(false);
    x.fillStyle=ROWBG;x.fillRect(M,y,W-2*M,27);

  d.items.forEach(row);
  for(let i=d.items.length;i<5;i++)row(null);
  const pre=[];
  if(c0.d>0||c0.vat>0)pre.push(['Subtotal',fmt(c0.sub)]);

  const st=d.status==='paid'?`Paid on ${fdEn(d.paidTs||Date.now())}${d.payMethod?' ('+(PM[d.payMethod]||d.payMethod)+')':''}`:(d.due?`Payment due ${fdEn(d.due)}`:'');
  const wrap=(t,max)=>{

  }
  y+=blockH;
  if(sh.note)T(sh.note,W/2,y+26,{sz:12,col:GREY,al:'center',max:W-2*M});
  if(pages.length>1)pages.forEach((pg,i)=>{x=pg.x;T(`${i+1} / ${pages.length}`,W/2,H-16,{sz:10,col:GREY,al:'center'})});
  return pages.map(p=>p.c);
}
async function getInv(d){
  const sh=S.shop,key=JSON.stringify([d,sh.name,sh.addr,sh.phone,sh.taxId,sh.note,sh.cur,sh.qr?sh.qr.length:0]);
  if(lastInv&&lastInv.key===key)return lastInv.pages;
  const pages=await invPages(d);lastInv={key,pages};return pages;
}
function buildPdf(canvases){
  const W=595,H=842,enc=new TextEncoder(),parts=[],offs={};let len=0;
  const push=d=>{const b=typeof d==='string'?enc.encode(d):d;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n${body}\nendobj\n`)};
  const jp=canvases.map(c=>{const b64=c.toDataURL('image/jpeg',0.92).split(',')[1],bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return {u,w:c.width,h:c.height}});
  const n=jp.length;
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${jp.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${n} >>`);
  jp.forEach((j,i)=>{
    const pg=3+3*i,ct=4+3*i,im=5+3*i,cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(ct,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[im]=len;
    push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.u.length} >>\nstream\n`);
    push(j.u);push('\nendstream\nendobj\n');
  });
  const N=2+3*n,xp=len;
  let xr=`xref\n0 ${N+1}\n0000000000 65535 f \n`;
  for(let id=1;id<=N;id++)xr+=String(offs[id]).padStart(10,'0')+' 00000 n \n';
  push(xr+`trailer\n<< /Size ${N+1} /Root 1 0 R >>\nstartxref\n${xp}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function downloadInvPdf(id){
  const v=S.invoices.find(x=>x.id===id);if(!v)return;
  try{
    toast('ກຳລັງສ້າງ PDF…');
    const blob=buildPdf(await getInv(invDoc(v))),name=v.no+'.pdf';
    let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
    if(dl){
      try{await dl.save({filename:name,data:blob});toast('ບັນທຶກ PDF ແລ້ວ')}
      catch(e){if(!e||e.code!=='declined')toast('ບໍ່ສາມາດບັນທຶກໄຟລ໌ໄດ້')}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      toast('ສ້າງ PDF ແລ້ວ');

  }catch(e){toast('ສ້າງ PDF ບໍ່ສຳເລັດ')}
}

function pickProdImg(el){readImg(el.files[0],320,d=>{tmpImg=d;$('pimg').innerHTML=imgPrev(d)},0.72)}
function calcMargin(){
  const c=num($('f_cost').value),p=num($('f_price').value),pr=p-c;
  const mg=p>0?pr/p*100:0,mk=c>0?pr/c*100:0;
  $('mg').innerHTML=`<div class="line"><span class="muted">ກຳໄລຕໍ່ອັນ</span><b class="num ${pr<0?'bad':'good'}">${fmt(pr)}</b></div><div class="line"><span class="muted">ອັດຕາກຳໄລ (ຈາກລາຄາຂາຍ)</span><span class="num">${mg.toFixed(1)}%</span></div><div class="line"><span class="muted">ບວກເພີ່ມຈາກຕົ້ນທຶນ</span><span class="num">${mk.toFixed(1)}%</span></div>`;
}
function tgPrice(){
  const c=num($('f_cost').value),t=num($('f_tg').value);

}
function saveProd(id){
  const name=$('f_name').value.trim();
  if(!name){toast('ກະລຸນາໃສ່ຊື່ສິນຄ້າ');return}
  const sku=$('f_sku').value.trim();
  if(sku&&S.products.some(x=>x.sku===sku&&x.id!==id)){toast('ບາໂຄດນີ້ຖືກໃຊ້ແລ້ວ');return}
  const d={name,sku,cat:$('f_cat').value.trim(),cost:num($('f_cost').value),price:num($('f_price').value),min:num($('f_min').value),img:tmpImg};
  if(id){Object.assign(prod(id),d)}
  else{
    const st=Math.max(0,Math.floor(num($('f_stock').value)));
    const p={id:uid(),stock:st,...d};S.products.push(p);
    if(st)S.moves.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,qty:st,kind:'ຍອດເລີ່ມຕົ້ນ'});
  }
  save();closeSheet();render();toast('ບັນທຶກແລ້ວ');
}
function delProd(id){S.products=S.products.filter(p=>p.id!==id);cart=cart.filter(c=>c.pid!==id);save();closeSheet();render();toast('ລຶບສິນຄ້າແລ້ວ')}

  <h3>ປະຫວັດການຊື້ເຂົ້າ</h3>
  ${pu.length?`<div class="list" style="padding:0 14px">${pu.map(x=>`<div class="line"><div><div>${esc(x.name)}</div><div class="muted small num">${x.qty} ອັນ × ${fmt(x.uc)}${x.extra?` + ຄ່າໃຊ້ຈ່າຍເພີ່ມ ${fmt(x.extra)}`:''} · ${fdt(x.ts)}</div></div><b class="num">${fmt(x.unit)}<span class="muted small">/ອັນ</span></b></div>`).join('')}</div>`:'<div class="empty">ຍັງບໍ່ມີປະຫວັດ ກົດ “ຮັບເຂົ້າ” ທີ່ແທັບສະຕັອກເມື່ອຊື້ສິນຄ້າ</div>'}
  <p class="note">ຕົ້ນທຶນສິນຄ້າໃຊ້ວິທີສະເລ່ຍຖ່ວງນ້ຳໜັກ: ທຸກຄັ້ງທີ່ຮັບເຄື່ອງເຂົ້າ ລະບົບລວມຄ່າຂົນສົ່ງ ແລະ ຄ່າໃຊ້ຈ່າຍເພີ່ມເຂົ້າຕົ້ນທຶນ ແລ້ວສະເລ່ຍກັບຂອງເດີມທີ່ເຫຼືອຢູ່</p>`;

const marg=p=>p.price?(p.price-p.cost)/p.price*100:0;
function calcCost(){
  const t=num($('c_total').value),n=num($('c_qty').value),sh=num($('c_ship').value),tx=num($('c_tax').value),ot=num($('c_oth').value),tg=num($('c_tg').value);
  const all=t+sh+tx+ot,u=n>0?all/n:0,sp=(tg>0&&tg<100)?u/(1-tg/100):0;
  $('c_out').innerHTML=`<div class="line"><span class="muted">ຕົ້ນທຶນລວມທັງໝົດ</span><b class="num">${fmt(all)}</b></div><div class="line"><span class="muted">ຕົ້ນທຶນຕໍ່ໜ່ວຍ</span><b class="num">${fmt(u)}</b></div><div class="line"><span class="muted">ລາຄາຂາຍແນະນຳ (ກຳໄລ ${tg||0}%)</span><b class="num good">${fmt(sp)}</b></div><div class="line"><span class="muted">ກຳໄລຕໍ່ໜ່ວຍ</span><span class="num">${fmt(sp-u)}</span></div>`;
}
function recvSheet(id){
  const p=prod(id);
  openSheet(`<h2>ຮັບສິນຄ້າເຂົ້າ</h2><p class="muted" style="margin-top:-6px">${esc(p.name)} · ຄົງເຫຼືອ ${p.stock}</p>
  <div class="g2"><label>ຈຳນວນທີ່ຮັບ<input id="r_qty" type="number" inputmode="numeric" oninput="calcRecv(${id})"></label><label>ລາຄາຊື້ຕໍ່ອັນ<input id="r_cost" type="number" inputmode="decimal" value="${p.cost}" oninput="calcRecv(${id})"></label></div>
  <label>ຄ່າຂົນສົ່ງ/ພາສີ/ຄ່າໃຊ້ຈ່າຍອື່ນໆຂອງລັອດນີ້ (ລວມທັງໝົດ)<input id="r_extra" type="number" inputmode="decimal" value="0" oninput="calcRecv(${id})"></label>
  <div class="pnl" style="margin-bottom:12px" id="rv"></div>
  <p class="note" style="margin-top:-4px">ລະບົບລວມຄ່າໃຊ້ຈ່າຍເພີ່ມເຂົ້າຕົ້ນທຶນ ຄຳນວນຕົ້ນທຶນສະເລ່ຍໃໝ່ ແລະ ບັນທຶກເປັນເງິນອອກ “ຊື້ສິນຄ້າເຂົ້າສະຕັອກ” ອັດຕະໂນມັດ</p>
  <div class="g2"><button class="btn ghost" onclick="closeSheet()">ຍົກເລີກ</button><button class="btn" onclick="saveRecv(${id})">ບັນທຶກຮັບເຂົ້າ</button></div>`);
  calcRecv(id);
}
function landed(qty,uc,extra){return qty>0?r2(uc+extra/qty):uc}
function newAvg(p,qty,unit){const base=Math.max(p.stock,0);return qty+base>0?r2((base*p.cost+qty*unit)/(base+qty)):p.cost}
function calcRecv(id){
  const p=prod(id),qty=Math.floor(num($('r_qty').value)),uc=num($('r_cost').value),ex=num($('r_extra').value);
  const un=landed(qty,uc,ex);
  $('rv').innerHTML=`<div class="line"><span class="muted">ຍອດຈ່າຍຮອບນີ້</span><b class="num">${fmt(qty*uc+ex)}</b></div><div class="line"><span class="muted">ຕົ້ນທຶນລັອດນີ້/ອັນ (ລວມຄ່າໃຊ້ຈ່າຍເພີ່ມ)</span><span class="num">${fmt(un)}</span></div><div class="line"><span class="muted">ຕົ້ນທຶນສະເລ່ຍໃໝ່/ອັນ</span><b class="num">${fmt(newAvg(p,qty,un))}</b></div><div class="line"><span class="muted">ຄົງເຫຼືອຫຼັງຮັບ</span><span class="num">${p.stock+Math.max(qty,0)}</span></div>`;
}
function saveRecv(id){
  const p=prod(id),qty=Math.floor(num($('r_qty').value)),uc=num($('r_cost').value),ex=num($('r_extra').value);
  if(qty<=0){toast('ກະລຸນາໃສ່ຈຳນວນ');return}
  const now=Date.now(),un=landed(qty,uc,ex);
  p.cost=newAvg(p,qty,un);p.stock+=qty;
  S.moves.push({id:uid(),ts:now,pid:id,name:p.name,qty,kind:'ຮັບເຂົ້າ @'+fmt(un)});
  S.purchases.push({id:uid(),ts:now,pid:id,name:p.name,qty,uc,extra:ex,unit:un});
  S.entries.push({id:uid(),ts:now,type:'expense',cat:'ຊື້ສິນຄ້າເຂົ້າສະຕັອກ',amount:r2(qty*uc+ex),note:p.name+' × '+qty,auto:'stock'});
  save();closeSheet();render();toast('ຮັບສິນຄ້າເຂົ້າແລ້ວ');
}
function adjSheet(id){
  const p=prod(id);
  openSheet(`<h2>ປັບຍອດສະຕັອກ</h2><p class="muted" style="margin-top:-6px">${esc(p.name)} · ໃນລະບົບ ${p.stock}</p>
  <label>ຈຳນວນທີ່ນັບໄດ້ຕົວຈິງ<input id="a_qty" type="number" inputmode="numeric" value="${p.stock}"></label>

function saveAdj(id){

  p.stock=n;S.moves.push({id:uid(),ts:Date.now(),pid:id,name:p.name,qty:d,kind:'ປັບຍອດຕາມນັບຕົວຈິງ'});
  save();closeSheet();render();toast('ປັບຍອດແລ້ວ');

const EXP_CATS=['ຄ່າເຊົ່າສະຖານທີ່','ຄ່ານ້ຳ-ຄ່າໄຟ','ເງິນເດືອນ/ຄ່າຈ້າງ','ຄ່າຂົນສົ່ງ','ຄ່າການຕະຫຼາດ','ອື່ນໆ'];

function viewCash(){

  return `<h2 style="margin:6px 0 0">ລາຍຮັບ-ລາຍຈ່າຍ</h2>
  ${periodChips()}
  <div class="strip"><div><span class="muted small">ເງິນເຂົ້າ</span><b class="num good">${fmt(inn)}</b></div><div><span class="muted small">ເງິນອອກ</span><b class="num bad">${fmt(out)}</b></div><div><span class="muted small">ສຸດທິ</span><b class="num ${inn-out<0?'bad':''}">${fmt(inn-out)}</b></div></div>
  <div class="g2" style="margin:12px 0"><button class="btn" onclick="entrySheet('income')">+ ລາຍຮັບ</button><button class="btn ghost" onclick="entrySheet('expense')">+ ລາຍຈ່າຍ</button></div>
  ${L.length?`<div class="list">${L.map(e=>`<div class="item" style="cursor:default"><div><div class="t">${esc(e.cat)}</div><div class="muted small">${esc(e.note||'')}${e.note?' · ':''}${fdt(e.ts)}</div></div><div class="row"><b class="num ${e.type==='income'?'good':'bad'}">${e.type==='income'?'+':'−'}${fmt(e.amount)}</b>${e.auto?'':`<button class="btn sm danger" aria-label="ລຶບລາຍການ" onclick="confirmAct('ລຶບລາຍການນີ້?','delEntry(${e.id})')">ລຶບ</button>`}</div></div>`).join('')}</div>`:'<div class="empty">ຍັງບໍ່ມີລາຍການໃນໄລຍະນີ້</div>'}
  <p class="note">ລາຍການຂາຍ ແລະ ການຊື້ສິນຄ້າເຂົ້າສະຕັອກຖືກບັນທຶກອັດຕະໂນມັດ ສ່ວນລາຍການອື່ນສາມາດເພີ່ມເອງໄດ້</p>`;
}
function entrySheet(type){
  const cats=type==='income'?INC_CATS:EXP_CATS;
  openSheet(`<h2>${type==='income'?'ເພີ່ມລາຍຮັບ':'ເພີ່ມລາຍຈ່າຍ'}</h2>
  <label>ຈຳນວນເງິນ<input id="e_amt" type="number" inputmode="decimal"></label>
  <label>ໝວດ<select id="e_cat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></label>
  <label>ບັນທຶກເພີ່ມເຕີມ<input id="e_note"></label>
  <div class="g2"><button class="btn ghost" onclick="closeSheet()">ຍົກເລີກ</button><button class="btn" onclick="saveEntry('${type}')">ບັນທຶກ</button></div>`);
}
function saveEntry(type){
  const a=num($('e_amt').value);
  if(a<=0){toast('ກະລຸນາໃສ່ຈຳນວນເງິນ');return}
  S.entries.push({id:uid(),ts:Date.now(),type,cat:$('e_cat').value,amount:a,note:$('e_note').value.trim()});
  save();closeSheet();render();toast('ບັນທຶກແລ້ວ');
}
function delEntry(id){S.entries=S.entries.filter(e=>e.id!==id);save();closeSheet();render()}

/* ---------- ລາຍງານ ---------- */
function setRepSeg(k){repSeg=k;render()}
function viewRep(){
  return `<h2 style="margin:6px 0 0">ລາຍງານ</h2>${seg([['sales','ລາຍງານຍອດຂາຍ'],['pnl','ກຳໄລ-ຂາດທຶນ']],repSeg,'setRepSeg')}${periodChips()}${repSeg==='sales'?viewSales():viewPnl()}`;
}
function viewSales(){
  const L=S.sales.filter(s=>inPeriod(s.ts)).sort((a,b)=>b.ts-a.ts);
  const rev=L.reduce((a,s)=>a+s.total,0),n=L.length;
  const pcs=L.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0),disc=L.reduce((a,s)=>a+(s.discount||0),0);
  let cash=0,qr=0,oth=0;L.forEach(s=>{const p=payOf(s);cash+=p.cash;qr+=p.qr;oth+=p.other});
  const pc=v=>rev?v/rev*100:0;
  const days=(period==='month'||period==='all')?30:7,bars=[];
  for(let i=days-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=d.toDateString();bars.push({d,v:S.sales.filter(s=>new Date(s.ts).toDateString()===k).reduce((a,s)=>a+s.total,0)})}
  const mx=Math.max(1,...bars.map(b=>b.v));
  const tp={};L.forEach(s=>s.items.forEach(i=>{const t=tp[i.name]||(tp[i.name]={q:0,r:0});t.q+=i.qty;t.r+=i.price*i.qty}));
  const top=Object.entries(tp).sort((a,b)=>b[1].r-a[1].r).slice(0,5);
  return `<div class="strip"><div><span class="muted small">ຍອດຂາຍ</span><b class="num">${fmt(rev)}</b></div><div><span class="muted small">ຈຳນວນບິນ</span><b class="num">${n}</b></div><div><span class="muted small">ສະເລ່ຍ/ບິນ</span><b class="num">${fmt(n?rev/n:0)}</b></div></div>
  <p class="note">ຂາຍໄດ້ ${pcs} ອັນ · ສ່ວນຫຼຸດລວມ ${fmt(disc)}</p>
  <h3>ຊ່ອງທາງຊຳລະເງິນ</h3>
  <div class="pnl"><div class="meter"><i style="width:${pc(cash)}%;background:var(--brand)"></i><i style="width:${pc(qr)}%;background:var(--yellow)"></i><i style="width:${pc(oth)}%;background:var(--muted)"></i></div>
    <div class="line"><span><span class="badge brand">■</span> ເງິນສົດ</span><span class="num">${fmt(cash)} · ${pc(cash).toFixed(0)}%</span></div>
    <div class="line"><span><span class="badge">■</span> QR</span><span class="num">${fmt(qr)} · ${pc(qr).toFixed(0)}%</span></div>
    ${oth>0?`<div class="line"><span>ອື່ນໆ (ບິນເກົ່າ)</span><span class="num">${fmt(oth)}</span></div>`:''}</div>
  <h3>ຍອດຂາຍລາຍວັນ (${days} ມື້ຫຼ້າສຸດ)</h3>
  <div class="chart"><div class="bars">${bars.map(b=>`<div class="b" title="${b.d.toLocaleDateString('lo-LA')} ${fmt(b.v)}" style="height:${Math.max(2,b.v/mx*100)}%"></div>`).join('')}</div><div class="barl">${bars.map((b,i)=>`<span>${days>7&&i%5!==0?'':b.d.getDate()}</span>`).join('')}</div><div class="muted small" style="margin-top:6px">ສູງສຸດ ${fmt(mx===1&&!bars.some(b=>b.v)?0:mx)}</div></div>
  <h3>ສິນຄ້າຂາຍດີ (ຕາມຍອດຂາຍ)</h3>
  ${top.length?`<div class="list" style="padding:0 14px">${top.map(([nm,t])=>`<div class="line"><div>${esc(nm)}<div class="muted small">ຂາຍໄດ້ ${t.q} ອັນ</div></div><b class="num">${fmt(t.r)}</b></div>`).join('')}</div>`:'<div class="empty">ຍັງບໍ່ມียອດຂາຍໃນໄລຍະນີ້</div>'}
  <h3>ລາຍການບິນ${L.length>40?' (40 ບິນຫຼ້າສຸດ)':''}</h3>
  ${L.length?`<div class="list">${L.slice(0,40).map(s=>`<div class="item" tabindex="0" onclick="saleSheet(${s.id})"><div><div class="t">${esc(s.no)}${s.cust?' · '+esc(s.cust):''}</div><div class="muted small">${fdt(s.ts)} · ${esc(s.method)}</div></div><b class="num">${fmt(s.total)}</b></div>`).join('')}</div><p class="note">ກົດທີ່ບິນເພື່ອເບິ່ງລາຍລະອຽດ, ສ້າງ Invoice ຫຼື ຍົກເລີກບິນ</p>`:'<div class="empty">ຍັງບໍ່ມີບິນໃນໄລຍະນີ້</div>'}`;
}
function viewPnl(){
  const sales=S.sales.filter(s=>inPeriod(s.ts));
  const rev=sales.reduce((a,s)=>a+s.total,0),cogs=sales.reduce((a,s)=>a+s.cogs,0),gross=rev-cogs;
  const man=S.entries.filter(e=>(!e.auto||e.auto==='inv')&&inPeriod(e.ts));
  const oi=man.filter(e=>e.type==='income').reduce((a,e)=>a+e.amount,0);
  const ex=man.filter(e=>e.type==='expense');
  const opex=ex.reduce((a,e)=>a+e.amount,0);
  const net=gross+oi-opex;
  const by={};ex.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const tp={};sales.forEach(s=>s.items.forEach(i=>{const t=tp[i.name]||(tp[i.name]={q:0,p:0});t.q+=i.qty;t.p+=(i.price-i.cost)*i.qty}));
  const top=Object.entries(tp).sort((a,b)=>b[1].p-a[1].p).slice(0,5);
  const gm=rev?gross/rev*100:0;
  return `<div class="hero"><span class="muted">${net<0?'ຂາດທຶນສຸດທິ':'ກຳໄລສຸດທິ'}</span><div class="big num ${net<0?'bad':'good'}">${fmt(Math.abs(net))}</div><span class="muted small">${sales.length} ບິນ · ກຳໄລຂັ້ນຕົ້ນ ${gm.toFixed(1)}% ຂອງຍອດຂາຍ</span></div>
  <div class="pnl" style="margin-top:12px">
    <div class="line"><span>ຍອດຂາຍ (ຫຼັງຫັກສ່ວນຫຼຸດ)</span><span class="num">${fmt(rev)}</span></div>
    <div class="line"><span class="muted">ຫັກ ຕົ້ນທຶນສິນຄ້າທີ່ຂາຍ</span><span class="num">−${fmt(cogs)}</span></div>
    <div class="line"><b>ກຳໄລຂັ້ນຕົ້ນ</b><b class="num">${fmt(gross)}</b></div>
    <div class="line"><span class="muted">ບວກ ລາຍຮັບອື່ນ / Invoice ທີ່ຮັບເງິນແລ້ວ</span><span class="num">+${fmt(oi)}</span></div>
    ${Object.entries(by).map(([k,v])=>`<div class="line"><span class="muted">ຫັກ ${esc(k)}</span><span class="num">−${fmt(v)}</span></div>`).join('')}
    ${!Object.keys(by).length?`<div class="line"><span class="muted">ຫັກ ຄ່າໃຊ້ຈ່າຍດຳເນີນງານ</span><span class="num">−${fmt(0)}</span></div>`:''}
    <div class="line"><b>${net<0?'ຂາດທຶນສຸດທິ':'ກຳໄລສຸດທິ'}</b><b class="num ${net<0?'bad':'good'}">${fmt(net)}</b></div>
  </div>
  <p class="note">ຕົ້ນທຶນໃຊ້ລາຄາຕົ້ນທຶນ ນະ ວັນທີຂາຍ ການຊື້ສິນຄ້າເຂົ້າສະຕັອກຈຶ່ງບໍ່ຖືກນັບເປັນຄ່າໃຊ້ຈ່າຍຊ້ຳ</p>
  <h3>ສິນຄ້າເຮັດກຳໄລສູງສຸດ (ກ່ອນສ່ວນຫຼຸດ)</h3>
  ${top.length?`<div class="list" style="padding:0 14px">${top.map(([n,t])=>`<div class="line"><div>${esc(n)}<div class="muted small">ຂາຍໄດ້ ${t.q} ອັນ</div></div><b class="num ${t.p<0?'bad':''}">${fmt(t.p)}</b></div>`).join('')}</div>`:'<div class="empty">ຍັງບໍ່ມียອດຂາຍໃນໄລຍະນີ້</div>'}`;
}

/* ---------- ຕັ້ງຄ່າຮ້ານ ---------- */
function settingsSheet(){
  const s=S.shop;tmpQr=s.qr||'';
  openSheet(`<h2>ຕັ້ງຄ່າຮ້ານ</h2>
  <label>ຊື່ຮ້ານ<input id="s_name" value="${esc(s.name)}"></label>
  <label>ທີ່ຢູ່<input id="s_addr" value="${esc(s.addr)}"></label>
  <div class="g2"><label>ເບີໂທ<input id="s_phone" value="${esc(s.phone)}"></label><label>ເລກປະຈຳຕົວຜູ້ເສຍພາສີ<input id="s_tax" value="${esc(s.taxId)}"></label></div>
  <div class="g2"><label>ສັນຍະລັກເງິນ<input id="s_cur" value="${esc(s.cur)}"></label><label>VAT % (0 = ບໍ່ສະແດງ)<input id="s_vat" type="number" inputmode="decimal" value="${s.vat}"></label></div>
  <div class="chips" style="margin-top:-6px">${['₭','฿','$'].map(c=>`<button class="chip" onclick="$('s_cur').value='${c}'">${c}</button>`).join('')}<span class="muted small" style="align-self:center">ການປ່ຽນສັນຍະລັກບໍ່ປ່ຽນແປງລາຄາສິນຄ້າ</span></div>
  <label>ຂໍ້ຄວາມທ້າຍ Invoice<input id="s_note" value="${esc(s.note)}"></label>
  <div class="pimg"><div class="pv" id="qrprev" style="width:96px;height:96px">${imgPrev(tmpQr)}</div><div><input id="s_qr" type="file" accept="image/*" style="display:none" onchange="readImg(this.files[0],520,d=>{tmpQr=d;$('qrprev').innerHTML=imgPrev(d)},0.9)"><div class="small muted" style="margin-bottom:6px">ຮູບ QR ຮັບເງິນຂອງຮ້ານ (ສະແດງຕອນລູກຄ້າຈ່າຍດ້ວຍ QR)</div><button class="btn sm ghost" onclick="$('s_qr').click()">ອັບໂຫຼດຮູບ QR</button> <button class="btn sm danger" onclick="tmpQr='';$('qrprev').innerHTML=imgPrev('')">ລຶບ</button></div></div>
  <div class="g2"><button class="btn ghost" onclick="closeSheet()">ຍົກເລີກ</button><button class="btn" onclick="saveSettings()">ບັນທຶກ</button></div>
  <h3>ຈັດການຂໍ້ມູນ</h3>
  <div class="g2"><button class="btn ghost" onclick="confirmAct('ລ້າງຂໍ້ມູນທັງໝົດ (ສິນຄ້າ, ຍອດຂາຍ, ລາຍຮັບ-ລາຍຈ່າຍ) ແລ້ວເລີ່ມໃໝ່ ບໍ່ສາມາດຍ້ອນກັບໄດ້','resetAll(false)')">ລ້າງຂໍ້ມູນທັງໝົດ</button><button class="btn ghost" onclick="confirmAct('ປ່ຽນແທນຂໍ້ມູນດ້ວຍສິນຄ້າຕົວຢ່າງ','resetAll(true)')">ໂຫຼດຂໍ້ມູນຕົວຢ່າງ</button></div>
  <p class="note">ຂໍ້ມູນເກັບໄວ້ໃນບຣາວເຊີເຄື່ອງນີ້ເທົ່ານັ້ນ</p>`);
}
function saveSettings(){
  S.shop={name:$('s_name').value.trim()||'POS ຮ້ານຄ້າ',addr:$('s_addr').value.trim(),phone:$('s_phone').value.trim(),taxId:$('s_tax').value.trim(),cur:$('s_cur').value.trim()||'₭',vat:Math.max(0,num($('s_vat').value)),note:$('s_note').value.trim(),qr:tmpQr};
  save();closeSheet();render();toast('ບັນທຶກການຕັ້ງຄ່າແລ້ວ');
}
function resetAll(demo){const sh=S.shop;S=demo?seed():blank();S.shop={...sh};cart=[];save();closeSheet();render();toast(demo?'ໂຫຼດຂໍ້ມູນຕົວຢ່າງແລ້ວ':'ລ້າງຂໍ້ມູນແລ້ວ')}

S=load();
try{
  $('today').textContent=new Date().toLocaleDateString('lo-LA',{day:'numeric',month:'short',year:'numeric'});
}catch(e){
  $('today').textContent=new Date().toLocaleDateString();
}
render();
</script>
</body>
</html>
